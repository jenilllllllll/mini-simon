/**
 * Nginx Configuration for Mini-Simon
 * 
 * This configuration:
 * - Serves the FastAPI dashboard on port 80/443
 * - Properly proxies WebSocket connections with Upgrade headers
 * - Handles static files efficiently
 * - Implements rate limiting and security headers
 * 
 * Install:
 *   sudo cp nginx-mini-simon.conf /etc/nginx/sites-available/mini-simon
 *   sudo ln -s /etc/nginx/sites-available/mini-simon /etc/nginx/sites-enabled/
 *   sudo nginx -t
 *   sudo systemctl reload nginx
 */

upstream mini_simon_backend {
    server 127.0.0.1:8000;
    keepalive 64;
}

# Rate limiting zone for API endpoints
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    # Server name - replace with your domain or use IP
    server_name _;  # Change to your domain: example.com www.example.com
    
    # Root and index
    root /opt/mini-simon/static;
    index index.html;
    
    # Logging
    access_log /var/log/nginx/mini-simon-access.log;
    error_log /var/log/nginx/mini-simon-error.log;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Static files - serve directly (adjust path as needed)
    location /static/ {
        alias /opt/mini-simon/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ =404;
    }
    
    # Favicon and robots.txt
    location = /favicon.ico {
        alias /opt/mini-simon/static/favicon.ico;
        log_not_found off;
        access_log off;
    }
    
    location = /robots.txt {
        alias /opt/mini-simon/static/robots.txt;
        log_not_found off;
        access_log off;
    }
    
    # WebSocket endpoint - CRITICAL: Must include Upgrade headers
    location /ws {
        proxy_pass http://mini_simon_backend;
        
        # WebSocket support headers - ESSENTIAL for WebSocket connectivity
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts - keep connections alive
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        # Disable buffering for real-time data
        proxy_buffering off;
        proxy_cache off;
        
        # Connection settings
        proxy_connect_timeout 60s;
        proxy_redirect off;
    }
    
    # FastAPI WebSocket endpoint (alternative path)
    location /api/v1/ws {
        proxy_pass http://mini_simon_backend;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }
    
    # Main application - proxy to FastAPI/UVicorn
    location / {
        proxy_pass http://mini_simon_backend;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Enable for WebSocket support on main path if needed
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Rate limiting for main endpoints
        limit_req zone=api_limit burst=100 nodelay;
        limit_conn conn_limit 20;
    }
    
    # API endpoints with stricter rate limiting
    location /api/ {
        proxy_pass http://mini_simon_backend;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Stricter rate limiting for API
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 10;
    }
    
    # Health check endpoint (bypass rate limiting)
    location /health {
        proxy_pass http://mini_simon_backend;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ \.(env|log|db|sqlite)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private must-revalidate;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
}

